<svg width="1024" height="460" viewBox="0 0 1024 460" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>

    <radialGradient id="bgGlow" cx="30%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#eaf1ff"/>
      <stop offset="55%" stop-color="#f4f8ff"/>
      <stop offset="100%" stop-color="#fbfdff"/>
    </radialGradient>

    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2f5fdb"/>
      <stop offset="100%" stop-color="#0f2f7a"/>
    </linearGradient>

    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5865F2"/>
      <stop offset="100%" stop-color="#3c45a5"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1a56db" flood-opacity="0.12"/>
    </filter>

    <clipPath id="clipCanvas">
      <rect x="0" y="0" width="1024" height="460" rx="28"/>
    </clipPath>

    <clipPath id="discordAvatarClip">
      <circle cx="732" cy="161" r="17"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clipCanvas)">
    <rect x="0" y="0" width="1024" height="460" fill="url(#bgGlow)"/>
    <rect x="0" y="0" width="1024" height="460" fill="none" stroke="#e2e9f7" stroke-width="1.5"/>
  </g>

  <!-- Announcement line -->
  <g>
    <circle cx="46" cy="46" r="4" fill="#1a56db"/>
    <text x="60" y="50" font-size="14" font-weight="500" fill="#5b6b8c">Full-stack developer</text>
    <text x="60" y="70" font-size="14" fill="#5b6b8c">Building web apps, automation tooling &amp; backend systems.</text>
  </g>

  <!-- Big Heading -->
  <text x="42" y="150" font-size="54" font-weight="600" fill="#101a33" letter-spacing="-1.2">Into the Build</text>

  <!-- Card 1: About Me -->
  <rect x="42" y="248" width="292" height="112" rx="16" fill="#ffffff" stroke="#1a56db" stroke-width="2" filter="url(#softShadow)"/>
  <text x="66" y="285" font-size="17" font-weight="700" fill="#101a33">About Me</text>
  <text x="66" y="312" font-size="13.5" fill="#5b6b8c">Full-stack developer focused on</text>
  <text x="66" y="332" font-size="13.5" fill="#5b6b8c">shipping clean, working products.</text>

  <!-- Card 2: What I Build -->
  <rect x="346" y="248" width="292" height="112" rx="16" fill="#ffffff" stroke="#dbe6fb" stroke-width="1.5"/>
  <text x="370" y="285" font-size="17" font-weight="700" fill="#101a33">What I Build</text>
  <text x="370" y="312" font-size="13.5" fill="#5b6b8c">Web apps, automation tooling,</text>
  <text x="370" y="332" font-size="13.5" fill="#5b6b8c">and backend systems.</text>

  <!-- Right panel: contact -->
  <rect x="668" y="40" width="316" height="320" rx="24" fill="url(#panelGrad)" filter="url(#softShadow)"/>

  <text x="700" y="82" font-size="21" font-weight="700" fill="#f2f6ff">Let's Connect</text>
  <text x="700" y="106" font-size="13" fill="#c7d6f9">Available for paid work &amp; collabs</text>

  <!-- Discord card -->
  <rect x="700" y="128" width="268" height="66" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
  <!-- Avatar circle with gradient + initial (no external pfp) -->
  <circle cx="732" cy="161" r="17" fill="url(#avatarGrad)"/>
  <text x="732" y="166" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
  <circle cx="732" cy="161" r="17" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>
  <text x="760" y="155" font-size="11" font-weight="500" fill="#c7d6f9">DISCORD</text>
  <text x="760" y="174" font-size="15" font-weight="700" fill="#ffffff">Cheese</text>
  <text x="760" y="188" font-size="9.5" fill="#8fa6e0">1368264423806074910</text>

  <!-- Email card -->
  <rect x="700" y="204" width="268" height="66" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
  <rect x="716" y="228" width="32" height="32" rx="8" fill="#ffffff"/>
  <!-- Inline Gmail-style icon -->
  <g transform="translate(722, 234)">
    <rect width="20" height="20" rx="3" fill="#EA4335"/>
    <path d="M3 5.5 L10 11 L17 5.5" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M3 5.5 L3 14.5 L17 14.5 L17 5.5" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <text x="760" y="231" font-size="11" font-weight="500" fill="#c7d6f9">EMAIL</text>
  <text x="760" y="250" font-size="11.5" font-weight="700" fill="#ffffff">dfgsdfgsdgdfs831@gmail.com</text>

  <text x="700" y="298" font-size="12.5" fill="#a9bdec">ETH · LTC · BTC accepted</text>
  <text x="700" y="318" font-size="12.5" fill="#a9bdec">Open to freelance &amp; contract work</text>

  <!-- Tech stack -->
  <text x="42" y="388" font-size="12.5" font-weight="700" fill="#1a56db" letter-spacing="1.2">TECH STACK</text>

  <!-- React -->
  <rect x="42" y="396" width="40" height="40" rx="10" fill="#ffffff" stroke="#dbe6fb" stroke-width="1.2"/>
  <image href="https://cdn.simpleicons.org/react/61DAFB" x="51" y="405" width="22" height="22"/>

  <!-- TypeScript -->
  <rect x="90" y="396" width="40" height="40" rx="10" fill="#ffffff" stroke="#dbe6fb" stroke-width="1.2"/>
  <image href="https://cdn.simpleicons.org/typescript/3178C6" x="99" y="405" width="22" height="22"/>

  <!-- JavaScript -->
  <rect x="138" y="396" width="40" height="40" rx="10" fill="#ffffff" stroke="#dbe6fb" stroke-width="1.2"/>
  <image href="https://cdn.simpleicons.org/javascript/F7DF1E" x="147" y="405" width="22" height="22"/>

  <!-- Next.js -->
  <rect x="186" y="396" width="40" height="40" rx="10" fill="#ffffff" stroke="#dbe6fb" stroke-width="1.2"/>
  <image href="https://cdn.simpleicons.org/nextdotjs/000000" x="195" y="405" width="22" height="22"/>

  <!-- Node.js -->
  <rect x="234" y="396" width="40" height="40" rx="10" fill="#ffffff" stroke="#dbe6fb" stroke-width="1.2"/>
  <image href="https://cdn.simpleicons.org/nodedotjs/339933" x="243" y="405" width="22" height="22"/>

  <!-- HTML5 -->
  <rect x="282" y="396" width="40" height="40" rx="10" fill="#ffffff" stroke="#dbe6fb" stroke-width="1.2"/>
  <image href="https://cdn.simpleicons.org/html5/E34F26" x="291" y="405" width="22" height="22"/>

  <!-- CSS3 -->
  <rect x="330" y="396" width="40" height="40" rx="10" fill="#ffffff" stroke="#dbe6fb" stroke-width="1.2"/>
  <image href="https://cdn.simpleicons.org/css3/1572B6" x="339" y="405" width="22" height="22"/>

  <!-- PostgreSQL -->
  <rect x="378" y="396" width="40" height="40" rx="10" fill="#ffffff" stroke="#dbe6fb" stroke-width="1.2"/>
  <image href="https://cdn.simpleicons.org/postgresql/4169E1" x="387" y="405" width="22" height="22"/>

  <!-- C++ -->
  <rect x="426" y="396" width="40" height="40" rx="10" fill="#ffffff" stroke="#dbe6fb" stroke-width="1.2"/>
  <image href="https://cdn.simpleicons.org/cplusplus/00599C" x="435" y="405" width="22" height="22"/>

  <!-- Python -->
  <rect x="474" y="396" width="40" height="40" rx="10" fill="#ffffff" stroke="#dbe6fb" stroke-width="1.2"/>
  <image href="https://cdn.simpleicons.org/python/3776AB" x="483" y="405" width="22" height="22"/>

  <!-- C# -->
  <rect x="522" y="396" width="40" height="40" rx="10" fill="#ffffff" stroke="#dbe6fb" stroke-width="1.2"/>
  <image href="https://cdn.simpleicons.org/csharp/239120" x="531" y="405" width="22" height="22"/>

  <!-- C -->
  <rect x="570" y="396" width="40" height="40" rx="10" fill="#ffffff" stroke="#dbe6fb" stroke-width="1.2"/>
  <text x="590" y="421" font-size="15" font-weight="700" fill="#00599C" text-anchor="middle">C</text>

  <!-- PowerShell -->
  <rect x="618" y="396" width="40" height="40" rx="10" fill="#ffffff" stroke="#dbe6fb" stroke-width="1.2"/>
  <image href="https://cdn.simpleicons.org/powershell/5391FE" x="627" y="405" width="22" height="22"/>

  <!-- YAML -->
  <rect x="666" y="396" width="40" height="40" rx="10" fill="#ffffff" stroke="#dbe6fb" stroke-width="1.2"/>
  <text x="686" y="420" font-size="9" font-weight="700" fill="#CB171E" text-anchor="middle">YAML</text>

  <!-- ASM -->
  <rect x="714" y="396" width="40" height="40" rx="10" fill="#ffffff" stroke="#dbe6fb" stroke-width="1.2"/>
  <text x="734" y="420" font-size="10" font-weight="700" fill="#4B5563" text-anchor="middle">ASM</text>

  <!-- Ruby -->
  <rect x="762" y="396" width="40" height="40" rx="10" fill="#ffffff" stroke="#dbe6fb" stroke-width="1.2"/>
  <image href="https://cdn.simpleicons.org/ruby/CC342D" x="771" y="405" width="22" height="22"/>
</svg>
