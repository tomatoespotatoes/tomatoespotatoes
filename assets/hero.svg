<svg width="1024" height="400" viewBox="0 0 1024 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>

    <radialGradient id="bgGlow" cx="30%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#eaf1ff"/>
      <stop offset="55%" stop-color="#f4f8ff"/>
      <stop offset="100%" stop-color="#fbfdff"/>
    </radialGradient>

    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2f5fdb"/>
      <stop offset="100%" stop-color="#0f2f7a"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1a56db" flood-opacity="0.12"/>
    </filter>

    <clipPath id="clipCanvas">
      <rect x="0" y="0" width="1024" height="400" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clipCanvas)">
    <rect x="0" y="0" width="1024" height="400" fill="url(#bgGlow)"/>
    <rect x="0" y="0" width="1024" height="400" fill="none" stroke="#e2e9f7" stroke-width="1.5"/>
  </g>

  <!-- Announcement line -->
  <g>
    <circle cx="46" cy="46" r="4" fill="#1a56db"/>
    <text x="60" y="44" font-size="14" font-weight="500" fill="#5b6b8c">Full-stack developer</text>
    <text x="60" y="64" font-size="14" fill="#5b6b8c">Building web apps, automation tooling &amp; backend systems.</text>
    <text x="483" y="64" font-size="14" fill="#1a56db" font-weight="600">→</text>
  </g>

  <!-- Big Heading -->
  <text x="42" y="150" font-size="54" font-weight="600" fill="#101a33" letter-spacing="-1">Into the Build</text>

  <!-- Card 1: About Me (highlighted, dark border) -->
  <rect x="42" y="248" width="292" height="112" rx="16" fill="#ffffff" stroke="#1a56db" stroke-width="2" filter="url(#softShadow)"/>
  <text x="66" y="285" font-size="17" font-weight="700" fill="#101a33">About Me</text>
  <text x="66" y="312" font-size="13.5" fill="#5b6b8c">Full-stack developer focused on</text>
  <text x="66" y="332" font-size="13.5" fill="#5b6b8c">shipping clean, working products.</text>

  <!-- Card 2: What I Build -->
  <rect x="346" y="248" width="292" height="112" rx="16" fill="#ffffff" stroke="#dbe6fb" stroke-width="1.5"/>
  <text x="370" y="285" font-size="17" font-weight="700" fill="#101a33">What I Build</text>
  <text x="370" y="312" font-size="13.5" fill="#5b6b8c">Web apps, automation tooling,</text>
  <text x="370" y="332" font-size="13.5" fill="#5b6b8c">and backend systems.</text>

  <!-- Right panel: contact -->
  <rect x="668" y="40" width="316" height="320" rx="24" fill="url(#panelGrad)" filter="url(#softShadow)"/>

  <text x="700" y="98" font-size="22" font-weight="700" fill="#f2f6ff">Let's Connect</text>
  <text x="700" y="126" font-size="22" font-weight="700" fill="#f2f6ff">Open for Work</text>

  <text x="700" y="164" font-size="13.5" fill="#c7d6f9">Available for paid work</text>
  <text x="700" y="184" font-size="13.5" fill="#c7d6f9">and collaborations.</text>

  <!-- Discord chip -->
  <rect x="700" y="216" width="228" height="40" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
  <text x="720" y="241" font-size="13.5" font-weight="600" fill="#f2f6ff">Discord</text>

  <!-- Email chip -->
  <rect x="700" y="266" width="228" height="40" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
  <text x="720" y="291" font-size="13.5" font-weight="600" fill="#f2f6ff">Email</text>

  <text x="700" y="336" font-size="12.5" fill="#a9bdec">ETH · LTC · BTC accepted</text>
</svg>
